product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

dependencies:
  - io.ktor:ktor-client-core:3.5.2
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - io.ktor:ktor-client-cio:3.5.2
  - $compose.uiTooling

dependencies@jvm:
  - io.ktor:ktor-client-cio:3.5.2

dependencies@wasmJs:
  - io.ktor:ktor-client-js:3.5.2

settings:
  compose:
    enabled: true
    resources:
      packageName: com.calairtime.resources
      exposedAccessors: true
